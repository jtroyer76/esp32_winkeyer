; esp32_winkeyer - WinKeyer-compatible CW keyer firmware for ESP32
;   atoms3_lite  M5Stack AtomS3 Lite  (ESP32-S3, native USB CDC)  <- primary
;   xiao_s3      Seeed XIAO ESP32-S3  (ESP32-S3, native USB CDC)
;   atom_lite    M5Stack Atom Lite    (classic ESP32, USB-UART bridge, resets on port open)

[platformio]
default_envs = atoms3_lite

[env]
platform = espressif32 @ 6.12.0
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11

[env:atoms3_lite]
board = m5stack-atoms3
build_flags =
    ${env.build_flags}
    -DBOARD_ATOMS3_LITE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Same board, console on USB for tools/check_timing.py (WinKeyer moves to UART1).
[env:atoms3_lite_console]
board = m5stack-atoms3
build_flags =
    ${env.build_flags}
    -DBOARD_ATOMS3_LITE
    -DUSB_CONSOLE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:atom_lite]
board = m5stack-atom
build_flags =
    ${env.build_flags}
    -DBOARD_ATOM_LITE
